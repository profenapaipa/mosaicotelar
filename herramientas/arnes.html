<!doctype html>

<!-- Lo lanza herramientas/auditar.py. Por qué existe: los fallos de este tipo de página no se
     ven leyendo el código, se ven midiendo en un navegador. Carga cada pantalla dentro de un
     marco del ancho de un celular o de un escritorio, y mide. Necesita servirse por http (no
     por file://) para poder leer el marco. -->
<body style="margin:0;background:#888">
<iframe id="f" style="border:0;display:block;background:#fff"></iframe>
<pre id="resultado" style="position:fixed;top:0;left:0;max-width:100%;background:#fff;color:#000;font:11px monospace;white-space:pre-wrap"></pre>
<script>
const SECC = { docente: ['resumen', 'estudiantes', 'actividades', 'ajustes', 'notas', 'archivos'], orientacion: ['resumen', 'ajustes', 'estudiantes', 'notas', 'archivos'], familia: ['resumen', 'archivos'], coordinacion: ['resumen', 'estudiantes', 'cursos', 'categorias'], estudiante: ['resumen', 'ruta', 'logros', 'archivos'] };
const RUTAS = [[null, '#/'], [null, '#/mi'], [null, '#/mapa/conexiones'], [null, '#/mapa/comparar'], [null, '#/valeria/chat'], [null, '#/valeria/conexion'], [null, '#/recorrido/camino'], [null, '#/recorrido/roles'], [null, '#/recorrido/datos'], [null, '#/portales'], [null, '#/portales/kinesis'], [null, '#/portales/wisfox'], [null, '#/portales/valeria'], [null, '#/glosario'], [null, '#/planes/planes'], [null, '#/planes/servicios'], [null, '#/registro/gratis'], [null, '#/registro/prueba'], [null, '#/guia/docente'], [null, '#/guia/estudiante'], [null, '#/hoja/propuesta'], [null, '#/hoja/arquitectura'], [null, '#/hoja/etapas'], [null, '#/piloto'], [null, '#/identidad'],
  ...Object.entries(SECC).flatMap(([rol, l]) => l.map((x) => [rol, '#/mi/' + x]))];
const ANCHOS = [390, 1280];
const TEMAS = ['claro', 'oscuro'];
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
const salida = { casos: [], flujo: [], fatal: null };
let n = 0;

function cargar(ruta, ancho) {
  return new Promise((res) => {
    f.style.width = ancho + 'px'; f.style.height = '900px';
    f.onload = () => res();
    f.src = '../index.html?t=' + (++n) + ruta;
  });
}
const doc = () => f.contentDocument;
const ventana = () => f.contentWindow;

/* ---- contraste ---- */
function parsear(c) {
  let m = c.match(/^rgba?\(([^)]+)\)/);
  if (m) { const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p[3] === undefined ? 1 : p[3]]; }
  m = c.match(/^color\(srgb ([^)]+)\)/);
  if (m) { const p = m[1].split(/[ \/]+/).filter(Boolean).map(Number); return [p[0] * 255, p[1] * 255, p[2] * 255, p[3] === undefined ? 1 : p[3]]; }
  return null;
}
function mezclar(sobre, base) { const a = sobre[3]; return [0, 1, 2].map((i) => sobre[i] * a + base[i] * (1 - a)); }
function fondoEfectivo(el) {
  const capas = [];
  for (let e = el; e; e = e.parentElement) {
    const cs = ventana().getComputedStyle(e);
    if (cs.backgroundImage !== 'none') return null;          // degradado: se omite y se cuenta aparte
    const c = parsear(cs.backgroundColor);
    if (c && c[3] > 0) { capas.push(c); if (c[3] >= 1) break; }
  }
  let base = [255, 255, 255];
  for (let i = capas.length - 1; i >= 0; i--) base = mezclar(capas[i], base);
  return base;
}
const lum = (c) => { const f2 = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f2(c[0]) + 0.7152 * f2(c[1]) + 0.0722 * f2(c[2]); };
const razon = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

function medirContraste() {
  const malos = []; let omitidos = 0; let medidos = 0;
  const d = doc();
  d.querySelectorAll('header *, main *, footer *, .nav-movil *').forEach((el) => {
    const tieneTexto = [...el.childNodes].some((x) => x.nodeType === 3 && x.textContent.trim());
    if (!tieneTexto || !el.getClientRects().length) return;
    const cs = ventana().getComputedStyle(el);
    if (cs.visibility === 'hidden' || parseFloat(cs.opacity) < 1) return;
    const fondo = fondoEfectivo(el);
    if (!fondo) { omitidos++; return; }
    let fg = parsear(cs.color); if (!fg) return;
    fg = mezclar(fg, fondo);
    const px = parseFloat(cs.fontSize); const grande = px >= 24 || (px >= 18.66 && parseInt(cs.fontWeight, 10) >= 700);
    const minimo = grande ? 3 : 4.5; const r = razon(fg, fondo); medidos++;
    if (r < minimo) malos.push(`${el.tagName.toLowerCase()}.${(el.className || '').toString().split(' ')[0]} "${el.textContent.trim().slice(0, 28)}" ${r.toFixed(2)}`);
  });
  return { malos: malos.slice(0, 6), total: malos.length, omitidos, medidos };
}

/* ---- una pantalla en un ancho y un tema ---- */
function medirCaso(ruta, ancho, tema) {
  const d = doc(); const w = ventana(); const fallos = [];
  d.documentElement.dataset.tema = tema;
  const e = d.documentElement;
  if (e.scrollWidth > e.clientWidth + 1) fallos.push(`desborda a lo ancho (${e.scrollWidth} > ${e.clientWidth})`);
  // Lo que está dentro de una tira con scroll propio (overflow-x auto) puede salirse a propósito.
  const enScroll = (x) => { for (let p = x.parentElement; p && p !== d.body; p = p.parentElement) { const o = w.getComputedStyle(p).overflowX; if (o === 'auto' || o === 'scroll') return true; } return false; };
  const fuera = [...d.querySelectorAll('main *')].filter((x) => { const r = x.getBoundingClientRect(); return r.width && (r.right > e.clientWidth + 1 || r.left < -1) && !enScroll(x); }).slice(0, 3).map((x) => x.tagName.toLowerCase() + '.' + (x.className || ''));
  if (fuera.length) fallos.push('elementos fuera de pantalla: ' + fuera.join(', '));
  if (w.__errores && w.__errores.length) fallos.push('errores: ' + w.__errores.join(' | '));
  const h1 = d.querySelectorAll('main h1').length + [...d.querySelectorAll('main [role="heading"][aria-level="1"]')].filter((x) => x.getClientRects().length).length;
  if (h1 !== 1) fallos.push(`hay ${h1} títulos h1 (debe haber 1)`);
  ['header', 'main', 'footer'].forEach((t) => { if (!d.querySelector(t)) fallos.push('falta <' + t + '>'); });
  const sinNombre = [...d.querySelectorAll('button, a, input, select, textarea')].filter((x) => x.getClientRects().length && !(x.textContent.trim() || x.getAttribute('aria-label') || (x.labels && x.labels.length) || x.getAttribute('aria-labelledby')));
  if (sinNombre.length) fallos.push(`${sinNombre.length} controles sin nombre accesible`);
  const chicos = [...d.querySelectorAll('button, .btn, input:not([type=hidden]), select, textarea')].filter((x) => { const r = x.getBoundingClientRect(); return r.height > 0 && r.height < 24; });
  if (chicos.length) fallos.push(`${chicos.length} controles de menos de 24 px de alto`);
  // Errores que se ven en pantalla pero no lanzan excepción: un append con una lista, un dato que falta.
  const crudo = d.body.innerText.match(/\[object [A-Za-z]+\]|\bundefined\b|\bNaN\b|\bnull\b/);
  if (crudo) fallos.push('texto roto en pantalla: "' + crudo[0] + '"');
  // Una tarjeta aplastada (un estilo en línea que gana al diseño de celular) no desborda, pero no se puede usar.
  const aplastadas = [...d.querySelectorAll('main .tarjeta, main .chat')].filter((x) => { const r = x.getBoundingClientRect(); return x.getClientRects().length && r.width < 150; });
  if (aplastadas.length) fallos.push(`${aplastadas.length} tarjetas aplastadas (menos de 150 px de ancho)`);
  // La barra de navegación debe verse completa: en celular, todos sus íconos dentro de la pantalla.
  const riel = [...d.querySelectorAll('.riel-items a')].filter((x) => { const r = x.getBoundingClientRect(); return r.width && (r.right > e.clientWidth + 1 || r.left < -1); });
  if (riel.length) fallos.push(`${riel.length} íconos del riel quedan fuera de la pantalla`);
  const c = medirContraste();
  if (c.total) fallos.push(`${c.total} textos sin contraste suficiente: ` + c.malos.join(' ; '));
  return { ruta, ancho, tema, fallos, contraste: { medidos: c.medidos, omitidos: c.omitidos } };
}

/* ---- el recorrido completo, como lo haría una persona ---- */
const hallar = (txt) => [...doc().querySelectorAll('button, a')].find((x) => x.textContent.trim().startsWith(txt) && x.getClientRects().length);
const textoPagina = () => doc().body.innerText;
function afirmar(nombre, ok, detalle) { salida.flujo.push({ nombre, ok: !!ok, detalle: ok ? '' : (detalle || '') }); }
async function ir(hash) { ventana().location.hash = hash; await espera(250); }
async function pulsar(txt) { const b = hallar(txt); if (!b) { afirmar('existe "' + txt + '"', false, 'no se encontró'); return false; } b.click(); await espera(250); return true; }

const enDialogo = (txt) => [...doc().querySelectorAll('dialog[open] button')].find((x) => x.textContent.trim().startsWith(txt));
const avisos = () => { const a = doc().getElementById('avisos'); return a ? a.innerText : ''; };
const poner = (el, valor) => { el.value = valor; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
const comoRol = async (rol, hash) => { ventana().MT.store.cambiar((s) => { s.rol = rol; }); await ir(hash); ventana().MT.router.recargar(); await espera(150); };
// Un archivo de prueba: PDF con su firma real, para que la validación de contenido lo acepte.
const pdf = (nombre) => new (ventana().File)([new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xe2, 0xe3])], nombre, { type: 'application/pdf' });
async function subir(archivo, visibilidad) {
  const sel = doc().getElementById('bib-vis'); if (visibilidad) poner(sel, visibilidad);
  const dt = new (ventana().DataTransfer)(); dt.items.add(archivo);
  const inp = doc().getElementById('bib-archivo'); inp.files = dt.files; inp.dispatchEvent(new Event('change', { bubbles: true }));
  await espera(500);
}
const CLINICOS = /TDAH|autismo|dislexia|discapacidad intelectual|d[eé]ficit de atenci[oó]n/i;

const traza = [];
async function flujo() {
  localStorage.clear();
  try { traza.push('paso 1: ' + ventana().MT.db.lista('actividades').length + '/' + (localStorage.getItem('mosaicotelar.v2') || '').length); } catch (e) { /* aún sin app */ }
  // 1. Entrada por rol
  await cargar('#/', 1280); await espera(400);
  afirmar('el inicio pregunta quién eres', textoPagina().includes('¿Quién eres?'));
  afirmar('hay una tarjeta por rol (5)', doc().querySelectorAll('.rol-tarjeta').length === 5);
  afirmar('el riel lleva a mi espacio, mapa, ValerIA y roles', ['mi', 'mapa', 'recorrido', 'planes', 'hoja', 'identidad'].every((id) => doc().querySelector(`.riel a[data-ruta="${id}"]`)));
  await pulsar('Soy docente');
  afirmar('elegir docente lleva a su guía de inicio rápido', ventana().location.hash === '#/guia/docente');

  afirmar('la guía tiene pasos, cada uno con su portal', doc().querySelectorAll('.guia-paso').length === 5 && /en kinesis/i.test(textoPagina()) && /en valeria/i.test(textoPagina()) && /en wisfox/i.test(textoPagina()));
  // La barra de portales está siempre arriba: Mi espacio, Kinesis, ValerIA y Wisfox, en el orden del flujo.
  const pestanas = () => [...doc().querySelectorAll('#barra-portales .pestana__ir')].map((a) => a.textContent.replace(/\s+/g, ' ').trim());
  afirmar('la barra de portales muestra las cuatro pestañas en el orden del flujo', /Mi espacio/.test(pestanas()[0]) && /Kinesis/.test(pestanas()[1]) && /ValerIA/.test(pestanas()[2]) && /Wisfox/.test(pestanas()[3]), pestanas().join(' | '));
  const abiertas = []; ventana().open = (u) => { abiertas.push(u); return null; };
  await pulsar('Ir a Kinesis'); await espera(600);

  afirmar('Ir a Kinesis lo muestra dentro de Mosaico Telar', ventana().location.hash === '#/portales/kinesis' && !!marcoK && marcoK.getAttribute('src') === ventana().MT.config.portales.kinesis && abiertas.length === 0, ventana().location.hash);
  afirmar('la pestaña activa se marca y el portal queda como abierto', doc().querySelector('#barra-portales .pestana[data-portal="kinesis"] .pestana__ir').getAttribute('aria-current') === 'page' && doc().querySelector('#barra-portales .pestana[data-portal="kinesis"]').classList.contains('pestana--abierta'));

  afirmar('la barra del portal es de una sola fila delgada', doc().querySelector('.vivo-barra').getBoundingClientRect().height < 90, String(doc().querySelector('.vivo-barra').getBoundingClientRect().height));
  afirmar('el portal se puede pasar a pantalla completa', [...doc().querySelectorAll('.vivo-barra button')].some((b) => /Pantalla completa/.test(b.textContent)));
  afirmar('el portal avisa que es una aplicación aparte con sus propios datos', /Aplicación aparte/.test(textoPagina()) && /propios datos/.test(doc().querySelector('.vivo-badge').title));
  // Lista desplegable de cada portal: qué hace tu rol ahí y dónde trabajarlo
  const caretWisfox = doc().querySelector('#barra-portales .pestana[data-portal="wisfox"] .pestana__abrir');
  caretWisfox.click(); await espera(200);
  const menuW = doc().getElementById('menu-portal-wisfox');

  const rm = menuW.getBoundingClientRect(); const tocado = doc().elementFromPoint(rm.left + 24, rm.top + 24);
  afirmar('la lista desplegable se VE completa (no queda recortada por la barra)', rm.width > 200 && rm.height > 100 && !!tocado && menuW.contains(tocado) && rm.bottom <= ventana().innerHeight, JSON.stringify([rm.width, rm.height, rm.bottom, ventana().innerHeight]));
  afirmar('solo hay un menú abierto a la vez', doc().querySelectorAll('.menu-portal:not([hidden])').length === 1);
  doc().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await espera(100);
  afirmar('Escape cierra la lista y devuelve el foco al botón', menuW.hidden && doc().activeElement === caretWisfox);
  caretWisfox.click(); await espera(150);
  [...menuW.querySelectorAll('a')].find((a) => /Ir a Wisfox/.test(a.textContent)).click(); await espera(600);
  const marcoW = doc().querySelector('.vivos iframe[src="' + ventana().MT.config.portales.wisfox + '"]');
  afirmar('desde la lista se salta a otro portal sin salir de la plataforma', !!marcoW && ventana().location.hash === '#/portales/wisfox' && !!doc().querySelector('.riel'));
  afirmar('Kinesis y Wisfox quedan abiertos a la vez', ['kinesis', 'wisfox'].every((p) => doc().querySelector('#barra-portales .pestana[data-portal="' + p + '"]').classList.contains('pestana--abierta')));
  // Los portales son persistentes: volver a ellos no los recarga, y se ven dos a la vez
  let cargas = 0; marcoK.addEventListener('load', () => cargas++); marcoW.addEventListener('load', () => cargas++);

  afirmar('al salir de los portales siguen en el documento, ocultos', marcoK.isConnected && marcoW.isConnected && marcoK.closest('[hidden]'));
  doc().querySelector('#barra-portales .pestana[data-portal="kinesis"] .pestana__ir').click(); await espera(500);
  afirmar('volver a un portal NO lo recarga: conserva lo que se estaba haciendo', cargas === 0 && marcoK.isConnected && !marcoK.closest('[hidden]'), 'cargas=' + cargas);
  poner(doc().getElementById('dividir-con'), 'wisfox'); await espera(300);
  afirmar('la vista dividida muestra dos portales lado a lado', [...doc().querySelectorAll('.vivo-panel')].filter((p) => !p.hidden).length === 2 && doc().querySelector('.vivo-marcos--2') && cargas === 0, 'cargas=' + cargas);
  [...doc().querySelectorAll('.vivos button')].find((b) => /Quitar vista dividida/.test(b.textContent)).click(); await espera(250);
  afirmar('se puede quitar la vista dividida', [...doc().querySelectorAll('.vivo-panel')].filter((p) => !p.hidden).length === 1);
  doc().querySelector('#barra-portales .pestana[data-portal="valeria"] .pestana__ir').click(); await espera(500);
  afirmar('la pestaña ValerIA trae el chat dentro de la plataforma', !!doc().querySelector('.vivo-panel[data-portal="valeria"]:not([hidden]) .chat') && !marcoK.closest('[hidden]') === false);
  // Cambiar de rol sin perder el lugar
  doc().getElementById('rol-actual').click(); await espera(200);
  afirmar('el selector de rol lista los cinco roles', doc().querySelectorAll('#menu-rol .menu-rol__lista button').length === 5 && !doc().getElementById('menu-rol').hidden);
  await ir('#/mi/ajustes'); ventana().MT.router.recargar();
  doc().getElementById('rol-actual').click(); await espera(150);
  [...doc().querySelectorAll('#menu-rol .menu-rol__lista button')].find((b) => /Orientación/.test(b.textContent)).click(); await espera(400);
  afirmar('cambiar de rol deja en la misma sección si el nuevo rol la tiene', ventana().location.hash === '#/mi/ajustes' && /Ajustes por revisar/.test(textoPagina()) && /Rol: Orientación/.test(doc().getElementById('rol-actual').textContent));
  doc().getElementById('rol-actual').click(); await espera(150);
  [...doc().querySelectorAll('#menu-rol .menu-rol__lista button')].find((b) => /Docente/.test(b.textContent)).click(); await espera(400);
  // La guía te acompaña dentro de Mi espacio
  await ir('#/mi/actividades'); ventana().MT.router.recargar(); await espera(200);
  afirmar('cada sección de Mi espacio dice en qué paso de la guía estás y qué sigue', /Paso 2 de 5 de tu guía/.test(textoPagina()) && !!hallar('Siguiente:') && !!hallar('Volver a mi guía'));

  afirmar('el botón Siguiente lleva al paso siguiente de la guía', /Paso 3 de 5|Pide ideas/.test(textoPagina()) || ventana().location.hash !== '#/mi/actividades');
  await ir('#/mi/ajustes'); ventana().MT.router.recargar();
  afirmar('donde se decide un ajuste se explica qué es un ajuste', /Qué es un ajuste/i.test(textoPagina()));
  // Las siglas se explican al tocarlas
  await ir('#/mi'); ventana().MT.router.recargar(); await espera(250);
  const termino = doc().querySelector('#app .termino');
  afirmar('la primera vez que aparece una sigla se vuelve un botón', !!termino && termino.tagName === 'BUTTON');
  if (termino) { termino.click(); await espera(250); }
  afirmar('tocar la sigla explica qué significa, sin pasar el cursor', /Diseño Universal para el Aprendizaje/.test(doc().querySelector('dialog[open]') ? doc().querySelector('dialog[open]').innerText : ''));
  if (doc().querySelector('dialog[open]')) { doc().querySelector('dialog[open]').close(); await espera(150); }
  await ir('#/glosario');
  afirmar('el glosario explica PIAR, DUA, ajuste y mínimo privilegio', ['PIAR', 'DUA', 'Ajuste', 'Mínimo privilegio'].every((t) => textoPagina().includes(t)));
  await ir('#/guia/docente'); ventana().MT.router.recargar();
  await pulsar('Trabajar en Mi espacio');
  afirmar('Trabajar en Mi espacio lleva al espacio del rol', ventana().location.hash === '#/mi/resumen');
  await ir('#/guia/estudiante'); ventana().MT.router.recargar();
  afirmar('la guía del estudiante apunta a Wisfox como portal principal', /Tu portal principal es Wisfox/.test(textoPagina()));
  await ir('#/portales');
  afirmar('los tres portales se muestran en paralelo con su flujo', doc().querySelectorAll('.portal').length === 3 && doc().querySelectorAll('.carril-paso').length === 9);
  await comoRol('docente', '#/mi');
  afirmar('el espacio tiene barra lateral, encabezado y cifras', !!doc().querySelector('.lateral .lockup') && !!doc().querySelector('.hero') && !!doc().querySelector('.panel-cifras'));

  try { traza.push('paso 2: ' + ventana().MT.db.lista('actividades').length + '/' + (localStorage.getItem('mosaicotelar.v2') || '').length); } catch (e) { /* aún sin app */ }
  // 2. Docente crea una actividad desde la malla de Inglés y edita su quiz

  await pulsar('Nueva actividad');
  afirmar('se abre el formulario de actividad', !!doc().querySelector('dialog[open] form'));
  poner(doc().querySelector('dialog[open] [name="desde"]'), 'ingles-8-1-1'); await espera(100);
  poner(doc().querySelector('dialog[open] [name="titulo"]'), 'Presente simple y continuo');
  enDialogo('Crear actividad').click(); await espera(300);
  afirmar('la actividad nueva aparece con el quiz copiado de la malla', /Presente simple y continuo/.test(textoPagina()) && /\d+ preguntas/.test(textoPagina()));
  const editar = [...doc().querySelectorAll('button')].filter((b) => b.textContent.trim() === 'Editar quiz').pop(); editar.click(); await espera(250);
  const enun = doc().querySelector('dialog[open] input[id^="q"]'); poner(enun, 'Pregunta editada en la prueba');
  enDialogo('Guardar quiz').click(); await espera(300);
  afirmar('el quiz se guarda', /Quiz guardado/.test(avisos()));
  const guardado = ventana().MT.db.lista('actividades').slice(-1)[0]; // slice: lista() devuelve el arreglo vivo del estado, pop() lo vaciaría
  afirmar('el cambio del quiz queda en los datos', guardado.quiz[0].q === 'Pregunta editada en la prueba');

  try { traza.push('paso 3: ' + ventana().MT.db.lista('actividades').length + '/' + (localStorage.getItem('mosaicotelar.v2') || '').length); } catch (e) { /* aún sin app */ }
  // 3. Archivos: subir, validar, permisos
  await ir('#/mi/archivos'); await espera(250);

      for (const tema of TEMAS) { salida.casos.push(medirCaso((rol ? rol + ' ' : '') + ruta, ancho, tema)); await espera(60); }
    }
  } catch (e) { salida.fatal = 'pantallas: ' + String(e && e.stack || e); }
  try {
    await flujo();
  } catch (e) { salida.fatal = (salida.fatal ? salida.fatal + ' | ' : '') + 'recorrido: ' + String(e && e.stack || e); }
  document.getElementById('resultado').textContent = JSON.stringify(salida);
  document.title = 'listo';
  // auditar.py escucha en /__resultado: así no hace falta ninguna espera fija.
  try { await fetch('/__resultado', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(salida) }); } catch (e) { /* abierto a mano, sin auditar.py */ }
})();
</script>
